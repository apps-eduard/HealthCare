# Optional Traefik IngressRoute / Ingress for Tailscale-only access.
# Replace hosts with your internal DNS or document /etc/hosts entries.
# Do not publish these hosts to the public internet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthcare-e2e
  namespace: doc-app
  labels:
    app.kubernetes.io/part-of: healthcare
    app.kubernetes.io/environment: e2e
  annotations:
    # Traefik on k3s typically watches Ingress automatically.
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: healthcare-e2e.home-lab.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healthcare-web-e2e
                port:
                  number: 8080
    - host: api-healthcare-e2e.home-lab.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: healthcare-api-e2e
                port:
                  number: 8080
