apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcare-api-e2e
  namespace: doc-app
  labels:
    app.kubernetes.io/name: healthcare-api
    app.kubernetes.io/instance: healthcare-api-e2e
    app.kubernetes.io/part-of: healthcare
    app.kubernetes.io/environment: e2e
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: healthcare-api-e2e
  template:
    metadata:
      labels:
        app.kubernetes.io/name: healthcare-api
        app.kubernetes.io/instance: healthcare-api-e2e
        app.kubernetes.io/part-of: healthcare
        app.kubernetes.io/environment: e2e
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: healthcare-api:e2e-local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: healthcare-e2e-config
            - secretRef:
                name: healthcare-e2e-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: healthcare-api-e2e
  namespace: doc-app
  labels:
    app.kubernetes.io/name: healthcare-api
    app.kubernetes.io/instance: healthcare-api-e2e
    app.kubernetes.io/part-of: healthcare
    app.kubernetes.io/environment: e2e
spec:
  selector:
    app.kubernetes.io/instance: healthcare-api-e2e
  ports:
    - name: http
      port: 8080
      targetPort: http
